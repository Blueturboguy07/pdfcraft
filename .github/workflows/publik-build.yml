# publik build of PdfCraft (telemetry v1 and later publik builds).
#
# It compiles the universal macOS binaries on a GitHub runner with this repo's own release script
# (packaging/macos/package.sh, ad-hoc signature, no notarization) and uploads them as artifacts.
# It holds no certificate. It reads one secret, PUBLIK_APP_TOKEN (the publik app token): a step writes
# it to publik-app-token.txt before the build, because that file is not in the repository.
# It creates no release and no tag.
# publik then signs, notarizes and staples on its own Mac with the same script:
#   packaging/macos/package.sh --arch universal --skip-build   (Developer ID + notary profile)
# PdfCraft only: the artifact also holds the OCR models of the bundle (models.tar.gz), see step 2b.
name: publik build

on:
  push:
    branches: ["telemetry/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publik-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS universal (unsigned)
    runs-on: macos-15
    timeout-minutes: 150
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      RUST_BACKTRACE: 1
      # The fonts the release embeds (same pin as .github/workflows/release.yml).
      CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
      CRAFT_FONTS_REQUIRED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Write the publik app token from the repository secret
        env:
          PUBLIK_APP_TOKEN: ${{ secrets.PUBLIK_APP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${PUBLIK_APP_TOKEN}" ]; then echo "::error::the repository secret PUBLIK_APP_TOKEN is empty"; exit 1; fi
          printf '%s' "${PUBLIK_APP_TOKEN}" > publik-app-token.txt
          echo "publik-app-token.txt: $(wc -c < publik-app-token.txt | tr -d ' ') bytes"
      - name: Check out craft-fonts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: storytold/craft-fonts
          ref: b076417b5880bd4154bd22f00695b1d28c6bea83
          path: craft-fonts
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: publik-build-macos-universal
          cache-on-failure: true
      - name: Check out craft-i18n (the commit in craft-i18n.rev)
        run: |
          set -euo pipefail
          # Upstream v0.19.0 keeps the interface translations in storytold/craft-i18n. build.rs embeds
          # them from CRAFT_I18N_DIR; CRAFT_I18N_REQUIRED=1 makes a missing checkout an error, as in
          # upstream's releases (storytold/craft-common-actions, actions/checkout-craft-i18n).
          rev=$(tr -d '[:space:]' < craft-i18n.rev)
          [[ "$rev" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::craft-i18n.rev holds no commit SHA: '$rev'"; exit 1; }
          git init -q craft-i18n
          git -C craft-i18n fetch -q --depth 1 https://github.com/storytold/craft-i18n "$rev"
          git -C craft-i18n checkout -q FETCH_HEAD
          [ "$(git -C craft-i18n rev-parse HEAD)" = "$rev" ]
          echo "CRAFT_I18N_DIR=$GITHUB_WORKSPACE/craft-i18n" >> "$GITHUB_ENV"
          echo "CRAFT_I18N_REQUIRED=1" >> "$GITHUB_ENV"
          echo "craft-i18n at $rev"
      - name: Test the AI step and the publik changes
        run: |
          set -euo pipefail
          # publik's AI step (crates/ui-egui/src/ai.rs: All tools > AI assistant, Preferences > AI).
          cargo test --locked -p pdfcraft-ui-egui --lib -- ai::
          # publik's links (publikhq.com, the Blueturboguy07 fork, no Discord) and its update source.
          cargo test --locked -p pdfcraft-engine --lib -- links::
          cargo test --locked -p pdfcraft-ui-egui --test it -- links:: updates:: \
            tabs_shrink_to_fit_then_arrows_step_through_them_and_open_stays_in_sight \
            the_integrated_title_bar_is_the_traffic_light_band
          # publik's bundle id gate and the network-crate baseline (the CLI's ureq for usage counts).
          cargo test --locked -p xtask -- macos_bundle_id_is_publiks_and_the_linux_app_id_is_unchanged netcheck::
      - name: Build and package (ad-hoc signature, no notarization)
        run: |
          # The short commit, as publik's earlier builds carry it (<APP>_BUILD_SHA).
          export "$(echo "pdfcraft" | tr '[:lower:]-' '[:upper:]_')_BUILD_SHA=$(git rev-parse --short HEAD)"
          packaging/macos/package.sh --arch universal
      - name: Collect the unsigned build
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/publik-out"
          mkdir -p "$OUT/bins" "$OUT/app"
          # 1. The thin binaries that `package.sh --skip-build` reads: target/<triple>/release/<bin>.
          : > "$OUT/bins.list"
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            find "target/$t/release" -maxdepth 1 -type f -perm +111 | while IFS= read -r f; do
              if file -b "$f" | grep -q "Mach-O"; then echo "${f#target/}" >> "$OUT/bins.list"; fi
            done
          done
          cat "$OUT/bins.list"
          [ -s "$OUT/bins.list" ]
          tar -czf "$OUT/bins/bins.tar.gz" -C target -T "$OUT/bins.list"
          # 2. The licence texts of the pinned craft-fonts checkout (package.sh copies them into the bundle).
          find craft-fonts/fonts -type f \( -name 'OFL*' -o -iname 'LICEN*' -o -iname '*.txt' \) -print0 \
            | tar -czf "$OUT/bins/craft-fonts-licences.tar.gz" --null -T -
          # 2b. PdfCraft only: the OCR models that package.sh staged into the bundle (`cargo xtask models`:
          #     every ATTRIBUTION.toml `kind = "model"` file, checked by SHA-256, its licence text and
          #     ATTRIBUTION.txt). publik's Mac compiles nothing, so its `--skip-build` run takes them from here.
          tar -czf "$OUT/bins/models.tar.gz" -C "target/macos-package/PdfCraft.app/Contents/Resources" models
          tar -tzvf "$OUT/bins/models.tar.gz"
          # 3. Facts about this build.
          {
            echo "slug=pdfcraft"
            echo "commit=$(git rev-parse HEAD)"
            echo "build_sha=$(git rev-parse --short HEAD)"
            echo "publik_build=$(tr -d '[:space:]' < packaging/PUBLIK_BUILD)"
            echo "fonts_ref=b076417b5880bd4154bd22f00695b1d28c6bea83"
            echo "i18n_ref=$(git -C craft-i18n rev-parse HEAD)"
            echo "runner=$(sw_vers -productName) $(sw_vers -productVersion) $(uname -m)"
            echo "rustc=$(rustc -V)"
            echo "cargo=$(cargo -V)"
            while IFS= read -r f; do
              echo "bin=$f archs=$(lipo -archs "target/$f") sha256=$(shasum -a 256 "target/$f" | cut -d' ' -f1)"
            done < "$OUT/bins.list"
            ls -l dist/release
          } | tee "$OUT/bins/build-info.txt"
          # 4. The ad-hoc signed app, packed with ditto (keeps symlinks). A reference copy.
          ditto -c -k --keepParent "target/macos-package/PdfCraft.app" "$OUT/app/PdfCraft.app.zip"
          ls -l "$OUT/bins" "$OUT/app"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pdfcraft-macos-bins
          path: ${{ runner.temp }}/publik-out/bins/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pdfcraft-macos-adhoc-app
          path: ${{ runner.temp }}/publik-out/app/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
